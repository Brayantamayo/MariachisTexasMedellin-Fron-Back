version: "3.9"

services:
  backend:
    build:
      context: ./Backend-MariachisTExas
      dockerfile: Dockerfile.dev
    container_name: softmartex_backend_dev
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
      PORT: 3000
      NODE_ENV: development
      FRONTEND_URL: ${FRONTEND_URL}
      JWT_SECRET: ${JWT_SECRET}
      BREVO_API_KEY: ${BREVO_API_KEY}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS}
      SPOTIFY_CLIENT_ID: ${SPOTIFY_CLIENT_ID}
      SPOTIFY_CLIENT_SECRET: ${SPOTIFY_CLIENT_SECRET}
      GROQ_API_KEY: ${GROQ_API_KEY}
    ports:
      - "3000:3000"
    volumes:
      - ./Backend-MariachisTExas/src:/app/src
      - ./Backend-MariachisTExas/prisma:/app/prisma
      - /app/node_modules
    networks:
      - softmartex_net

  frontend:
    build:
      context: ./Frontend-MariachisTExas
      dockerfile: Dockerfile.dev
    container_name: softmartex_frontend_dev
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      VITE_API_URL: ${VITE_API_URL}
    ports:
      - "5173:5173"
    volumes:
      - ./Frontend-MariachisTExas/src:/app/src
      - ./Frontend-MariachisTExas/public:/app/public
      - /app/node_modules
    networks:
      - softmartex_net

networks:
  softmartex_net:
    driver: bridge